[package]
name = "hse-crypt-1"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = true
strip = "symbols"

[dependencies]
colored = "3.1.1"
fern = "0.7.1"
inquire = "0.9.2"
log = "0.4.29"
inquire-derive = "0.9.0"
terminal = "0.2.1"
rand = { version = "0.10.0", features = ["sys_rng"] }